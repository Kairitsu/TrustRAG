name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g. 0.2.8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Rust backend (desktop mode)
        working-directory: backend
        run: cargo build --release --no-default-features --features desktop

      - name: Build Linux desktop
        working-directory: apps/client
        run: flutter build linux --release

      - name: Bundle backend with Flutter app
        run: |
          cp backend/target/release/trustrag-backend apps/client/build/linux/x64/release/bundle/

      - name: Package Linux build
        run: |
          cd apps/client/build/linux/x64/release/bundle
          tar czf ../../../../../trustrag-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-linux-x64
          path: apps/client/trustrag-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Rust backend (desktop mode)
        working-directory: backend
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --no-default-features --features desktop

      - name: Build Windows desktop
        working-directory: apps/client
        run: flutter build windows --release

      - name: Bundle backend with Flutter app
        run: |
          Copy-Item backend/target/release/trustrag-backend.exe apps/client/build/windows/x64/runner/Release/

      - name: Smoke test trustrag-backend.exe (health)
        shell: pwsh
        run: |
          $backend = "apps/client/build/windows/x64/runner/Release/trustrag-backend.exe"
          if (-not (Test-Path $backend)) { throw "Backend binary not found: $backend" }

          $tempDir = Join-Path $env:TEMP ("trustrag-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tempDir | Out-Null

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()

          $dbPath = Join-Path $tempDir "trustrag.db"
          $env:TRUSTRAG__LISTEN_ADDR = "127.0.0.1:$port"
          $env:TRUSTRAG__DATABASE_URL = "sqlite://$dbPath?mode=rwc"
          $env:TRUSTRAG__DATA_DIR = $tempDir
          $env:TRUSTRAG__JWT_SECRET = "smoke-test-secret-32chars-minimum!!"
          $env:TRUSTRAG__DOC_PROCESSOR_URL = "http://127.0.0.1:0"
          $env:RUST_LOG = "trustrag_backend=info"

          $proc = Start-Process -FilePath $backend -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -UseBasicParsing -TimeoutSec 3
                if ($resp.StatusCode -eq 200 -and $resp.Content -match 'ok') {
                  $ok = $true
                  break
                }
              } catch {}
              if ($proc.HasExited) {
                throw "trustrag-backend.exe exited early with code $($proc.ExitCode)"
              }
            }
            if (-not $ok) { throw "Health check failed on port $port" }
            Write-Host "Backend smoke test passed on port $port"
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
            }
            Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create Windows installer (Inno Setup)
        working-directory: apps/client
        run: |
          iscc windows/installer.iss

      - name: Package Windows portable
        run: |
          Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath apps/client/trustrag-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-windows-installer
          path: apps/client/TrustRAG-Setup-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-windows-portable
          path: apps/client/trustrag-windows-x64-portable.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Rust backend (desktop mode)
        working-directory: backend
        run: cargo build --release --no-default-features --features desktop

      - name: Build macOS app
        working-directory: apps/client
        run: flutter build macos --release

      - name: Bundle backend with macOS app
        run: |
          APP_DIR="apps/client/build/macos/Build/Products/Release/TrustRAG.app"
          cp backend/target/release/trustrag-backend "$APP_DIR/Contents/Resources/"

      - name: Package macOS build
        run: |
          cd apps/client/build/macos/Build/Products/Release
          tar czf ../../../../../trustrag-macos.tar.gz *.app

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-macos
          path: apps/client/trustrag-macos.tar.gz

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build iOS (no codesign)
        working-directory: apps/client
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: |
          cd apps/client/build/ios/iphoneos
          tar czf ../../../trustrag-ios.tar.gz Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-ios
          path: apps/client/trustrag-ios.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build Rust backend for Android (arm64)
        working-directory: backend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --release --no-default-features --features mobile

      - name: Bundle backend into Android jniLibs
        run: |
          mkdir -p apps/client/android/app/src/main/jniLibs/arm64-v8a
          cp backend/target/aarch64-linux-android/release/trustrag-backend apps/client/android/app/src/main/jniLibs/arm64-v8a/libtrustrap_backend.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Android APK
        working-directory: apps/client
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-android
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Web
        working-directory: apps/client
        run: flutter build web --release

      - name: Package Web build
        run: |
          cd apps/client/build/web
          tar czf ../../trustrag-web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: trustrag-web
          path: apps/client/trustrag-web.tar.gz

  release:
    needs: [build-linux, build-windows, build-macos, build-ios, build-android, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-alpha* ]] || [[ "$VERSION" == *-beta* ]] || [[ "$VERSION" == *-rc* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        run: node scripts/generate-release-notes.mjs "${{ steps.get_version.outputs.VERSION }}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: TrustRAG v${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE == 'true' }}
          files: |
            artifacts/trustrag-linux-x64/trustrag-linux-x64.tar.gz
            artifacts/trustrag-windows-installer/TrustRAG-Setup-Windows-x64.exe
            artifacts/trustrag-windows-portable/trustrag-windows-x64-portable.zip
            artifacts/trustrag-macos/trustrag-macos.tar.gz
            artifacts/trustrag-ios/trustrag-ios.tar.gz
            artifacts/trustrag-android/app-release.apk
            artifacts/trustrag-web/trustrag-web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
